<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Scale walk">
  <!-- the scale walked up and back down: note heads in an arch -->
  <g fill="currentColor" stroke="none">
    <ellipse cx="3.6" cy="19.4" rx="2" ry="1.45" transform="rotate(-22 3.6 19.4)"/>
    <ellipse cx="7.8" cy="15.4" rx="2" ry="1.45" transform="rotate(-22 7.8 15.4)"/>
    <ellipse cx="12" cy="12.6" rx="2" ry="1.45" transform="rotate(-22 12 12.6)"/>
    <ellipse cx="16.2" cy="15.4" rx="2" ry="1.45" transform="rotate(-22 16.2 15.4)"/>
    <ellipse cx="20.4" cy="19.4" rx="2" ry="1.45" transform="rotate(-22 20.4 19.4)"/>
  </g>
  <!-- the way: up and over, back down -->
  <path d="M3.6 14 Q12 -0.5 20.2 12.2"/>
  <path d="M20.6 8.7 L20.2 12.2 L17.1 10.6"/>
